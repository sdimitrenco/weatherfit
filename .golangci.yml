version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst
          - dupl

formatters:
  enable:
    - gofmt
    - goimports
